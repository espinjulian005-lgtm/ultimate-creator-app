name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ============ macOS build (.dmg) ============
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate macOS icon (.icns)
        run: |
          set -e
          ICONSET=build/icon.iconset
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          SRC=build/icon-512.png
          sips -z 16 16     "$SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64     "$SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128   "$SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_512x512.png"
          cp "$SRC"         "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o build/icon.icns
          ls -la build/icon.icns

      - name: Prepare bin directory
        run: |
          mkdir -p bin
          # yt-dlp for macOS
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o bin/yt-dlp
          chmod +x bin/yt-dlp
          # ffmpeg via Homebrew
          brew install ffmpeg
          cp "$(which ffmpeg)" bin/ffmpeg
          cp "$(which ffprobe)" bin/ffprobe || true
          # Real-ESRGAN for macOS (optional)
          curl -L https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-macos.zip -o /tmp/realesrgan.zip || true
          if [ -f /tmp/realesrgan.zip ]; then
            mkdir -p /tmp/realesrgan
            unzip -q /tmp/realesrgan.zip -d /tmp/realesrgan
            cp -R /tmp/realesrgan/* bin/ || true
            chmod +x bin/realesrgan-ncnn-vulkan || true
          fi

      - name: Build macOS DMG
        run: npm run package-mac
        env:
          # Skip code signing for now (requires Apple Developer cert)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.zip

  # ============ Windows build (.exe installer) ============
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Download binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile bin\yt-dlp.exe
          # ffmpeg essentials
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $env:TEMP\ffmpeg.zip
          Expand-Archive -Path $env:TEMP\ffmpeg.zip -DestinationPath $env:TEMP\ffmpeg
          $exe = Get-ChildItem -Path $env:TEMP\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName -Destination bin\ffmpeg.exe
          $probe = Get-ChildItem -Path $env:TEMP\ffmpeg -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if ($probe) { Copy-Item $probe.FullName -Destination bin\ffprobe.exe }
          # Real-ESRGAN
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip" -OutFile $env:TEMP\realesrgan.zip
          Expand-Archive -Path $env:TEMP\realesrgan.zip -DestinationPath $env:TEMP\realesrgan
          $foundExe = Get-ChildItem -Path $env:TEMP\realesrgan -Filter realesrgan-ncnn-vulkan.exe -Recurse | Select-Object -First 1
          if ($foundExe) {
            Copy-Item -Path "$($foundExe.Directory.FullName)\*" -Destination bin -Recurse -Force
          }

      - name: Build Windows installer
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.msi

  # ============ Linux build (.AppImage) ============
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Download binaries
        run: |
          mkdir -p bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
          chmod +x bin/yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cp $(which ffmpeg) bin/ffmpeg
          cp $(which ffprobe) bin/ffprobe || true

      - name: Build Linux AppImage
        run: npm run package-linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/*.deb

  # ============ Safari Web Extension (Xcode project + unsigned .app) ============
  # Non-blocking: if this job fails, the release still ships with the desktop builds.
  build-safari-extension:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert Chrome extension to Safari Web Extension
        run: |
          set -e
          mkdir -p safari-build
          xcrun safari-web-extension-converter \
            "$(pwd)/extension" \
            --project-location "$(pwd)/safari-build" \
            --app-name "Ultimate Creator Extension" \
            --bundle-identifier "com.julianespin.ultimate-creator-extension" \
            --no-prompt \
            --copy-resources \
            --force
          ls -la safari-build

      - name: Build unsigned Safari extension (.app)
        run: |
          set -e
          PROJECT=$(find safari-build -maxdepth 3 -name '*.xcodeproj' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "❌ No .xcodeproj produced by the converter"; exit 1
          fi
          echo "Project: $PROJECT"

          # Auto-detect the macOS scheme (converter scheme names vary by Xcode version)
          xcodebuild -project "$PROJECT" -list
          SCHEME_LIST=$(xcodebuild -project "$PROJECT" -list 2>/dev/null \
            | sed -n '/Schemes:/,/^$/p' | tail -n +2 | sed 's/^[[:space:]]*//' | sed '/^$/d')
          echo "Available schemes:"; echo "$SCHEME_LIST"
          SCHEME=$(echo "$SCHEME_LIST" | grep -i 'macos' | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$SCHEME_LIST" | grep -vi 'ios\|iphone\|ipad\|watch\|tv' | head -n 1)
          fi
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$SCHEME_LIST" | head -n 1)
          fi
          if [ -z "$SCHEME" ]; then
            echo "⚠️  No build scheme found — shipping Xcode project only."
            exit 0
          fi
          echo "Using scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build-safari \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build || echo "xcodebuild returned non-zero"

          APP=$(find build-safari -name '*.app' -path '*Release*' | head -n 1)
          if [ -z "$APP" ]; then
            echo "⚠️  Build did not produce a .app — shipping Xcode project only."
          else
            echo "App: $APP"
            ditto -c -k --keepParent "$APP" "safari-build/UltimateCreatorExtension-unsigned.app.zip"
            ls -la safari-build/UltimateCreatorExtension-unsigned.app.zip
          fi

      - name: Package Xcode project
        run: |
          set -e
          cd safari-build
          ditto -c -k --keepParent "Ultimate Creator Extension" "../UltimateCreatorExtension-Xcode-project.zip" 2>/dev/null \
            || zip -r "../UltimateCreatorExtension-Xcode-project.zip" "Ultimate Creator Extension"
          cd ..
          ls -la UltimateCreatorExtension-Xcode-project.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safari-extension
          path: |
            UltimateCreatorExtension-Xcode-project.zip
            safari-build/UltimateCreatorExtension-unsigned.app.zip
          if-no-files-found: warn

  # ============ Create GitHub Release on tags ============
  release:
    needs: [build-mac, build-windows, build-linux, build-safari-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-dmg/*
            artifacts/windows-installer/*
            artifacts/linux-appimage/*
            artifacts/safari-extension/*
          generate_release_notes: true
          draft: false
          prerelease: false
